[phases.setup]
nixPkgs = ["nodejs_22"]
cmds = ["corepack enable", "corepack prepare pnpm@10.6.5 --activate"]

[phases.install]
cmds = ["NODE_ENV=development pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @cronflow/api build"]

[start]
cmd = "node apps/api/dist/src/server.js"
